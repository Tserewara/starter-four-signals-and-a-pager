# The world around the catalog service. Only HTTP crosses into service/.
name: bgym_signals

services:
  service:
    build: ../service
    environment:
      STORE_URL: http://store:9100
    ports:
      - "8020:8000"
    depends_on:
      - store

  store:
    build: {context: ., dockerfile: tools.Dockerfile}
    command: ["python3", "fake_store.py"]
    ports:
      - "9100:9100"

  loadgen:
    build: {context: ., dockerfile: tools.Dockerfile}
    command: ["python3", "loadgen.py", "--rate", "10"]
    environment:
      SERVICE_URL: http://service:8000
    depends_on:
      - service

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  pager:
    build: {context: ., dockerfile: tools.Dockerfile}
    command: ["python3", "pager.py"]
    ports:
      - "9099:9099"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  tools:
    build: {context: ., dockerfile: tools.Dockerfile}
    profiles: ["tools"]
    environment:
      SERVICE_URL: http://service:8000

  contract:
    build: ../contract
    profiles: ["tools"]
    environment:
      SERVICE_URL: http://service:8000
      STORE_URL: http://store:9100
