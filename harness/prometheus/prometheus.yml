# Scrapes the service's GET /metrics every 5 seconds and evaluates every rule
# file in the repository's monitoring/rules/. `make reload` rereads them.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["service:8000"]
